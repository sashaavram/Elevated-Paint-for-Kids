# Publishes the app (the public/ folder) as a website on GitHub Pages:
# https://sashaavram.github.io/Elevated-Paint-for-Kids/
# Pages has no server, so "Ask Claude to draw" is hidden there; everything else works.
name: Publish website

on:
  push:
    branches: [claude/modest-mccarthy-fq7wy2, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
